id = "kosh"
name = "Koshka"
description = "Shell diagnostics, completion, and formatting from the Koshka shell."
version = "0.1.0"
schema_version = 1
authors = ["toiletbril"]
repository = "https://github.com/toiletbril/kosh"

[language_servers.kosh]
name = "kosh"
languages = [
  "Shell Script",
  "YAML",
  "Markdown",
  "JSON",
  "JSONC",
  "Dockerfile",
  "Docker Compose",
  "Make",
]

# Shell Script is left out on purpose.
[language_servers.kosh.language_ids]
"YAML" = "yaml"
"Markdown" = "markdown"
"JSON" = "json"
"JSONC" = "jsonc"
"Dockerfile" = "dockerfile"
"Docker Compose" = "yaml"
"Make" = "makefile"
