:root {
  color-scheme: dark light;
  --bg: #2c2c2e;
  --fg: #fff;
  --muted: #c7c7cc;
  --accent: #64b5ff;
  --rule: #636366;
  --start: #393737;
  --middle: #494951;
  --end: #34373c;
  --glow: #409cff1c;
  --panel: #41414127;
  --outline: #ffffff1f;
  --shadow: #00000066;
  --pre-bg: #1c1c1e;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #fff;
    --fg: #1d1d1f;
    --muted: #515154;
    --accent: #0066cc;
    --rule: #c7c7cc;
    --start: #f9f1f1;
    --middle: #dceaff;
    --end: #e2f3ee;
    --glow: #0071e31a;
    --panel: #e5e5e541;
    --outline: #1d1d1f38;
    --shadow: #00000020;
    --pre-bg: #f5f5f7;
  }
}

* { box-sizing: border-box; }

html {
  scroll-padding-top: 1rem;
  background: var(--bg);
  scrollbar-color: var(--muted) var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--fg);
  font: 20px/1.4 "Terminus", "Lucida Console", monospace;
  background:
    radial-gradient(ellipse at 50% 25%, var(--glow), transparent 65%),
    linear-gradient(var(--start), var(--middle) 50%, var(--end));
}

::selection {
  background: var(--fg);
  color: var(--bg);
}

a {
  color: var(--accent);
  text-underline-offset: 0.2em;
}

a:hover { text-decoration-thickness: 2px; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 4px;
}

.skip {
  position: absolute;
  top: -5rem;
  left: 1rem;
  z-index: 1;
  padding: 0.5rem 1rem;
  background: var(--bg);
}

.skip:focus { top: 1rem; }

.layout {
  display: grid;
  gap: 1.5rem;
  max-width: 120ch;
  margin: auto;
  padding: 2rem 1rem 4rem;
  align-items: start;
}

main,
nav.toc {
  min-width: 0;
  padding: 1.5rem;
  background: var(--panel);
  border: 1px solid var(--outline);
  border-radius: 0.6rem;
  box-shadow: inset 0 0 1rem var(--outline), 0 0 2rem var(--shadow);
}

main { overflow-wrap: anywhere; }

header.page {
  padding-bottom: 1rem;
  margin-bottom: 2rem;
  border-bottom: 1px solid var(--rule);
}

header.page h1 {
  margin: 0 0 0.4rem;
  font-size: 1.8rem;
}

header.page p,
footer.page {
  color: var(--muted);
}

.manuals {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 1.5rem;
  margin-top: 1rem;
}

h2,
h3 {
  line-height: 1.2;
  scroll-margin-top: 1rem;
}

h2 {
  margin: 2.5rem 0 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
  font-size: 1.25rem;
  text-transform: lowercase;
}

h3 {
  margin: 1.75rem 0 0.75rem;
  font-size: 1.1rem;
}

h2:first-of-type { margin-top: 0; }
p { margin: 0 0 1rem; }

code,
pre {
  font: inherit;
  color: inherit;
}

code {
  font-weight: bold;
  overflow-wrap: anywhere;
}

pre {
  margin: 0 0 1rem;
  padding: 1rem;
  overflow-x: auto;
  background: var(--pre-bg);
  border: 1px solid var(--outline);
  border-radius: 0.4rem;
  line-height: 1.25;
  overflow-wrap: normal;
}

pre code { overflow-wrap: normal; }
dl { margin: 0 0 1rem; }
dt { margin-top: 1rem; }
dt + dt { margin-top: 0.2rem; }
dd { margin: 0.35rem 0 0 2ch; }
dd > p:last-child { margin-bottom: 0; }
.rs { margin-left: 2ch; }

nav.toc {
  font-size: 0.9rem;
  line-height: 1.3;
}

nav.toc summary {
  cursor: pointer;
  font-weight: bold;
}

nav.toc ul {
  list-style: none;
  padding: 0;
  margin: 0.75rem 0 0;
}

nav.toc li { margin: 0.35rem 0; }
nav.toc ul ul { margin: 0.35rem 0 0.75rem 2ch; }
nav.toc > details > ul > li > a { text-transform: lowercase; }
nav.toc a { text-decoration: none; }
nav.toc a:hover { text-decoration: underline; }

footer.page {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--rule);
}

@media (max-width: 69.999rem) {
  nav.toc details > ul {
    max-height: 12rem;
    overflow-y: auto;
  }
}

@media (min-width: 70rem) {
  .layout { grid-template-columns: 28ch minmax(0, 78ch); }
  nav.toc {
    position: sticky;
    top: 1rem;
    max-height: calc(100vh - 2rem);
    overflow-y: auto;
  }
}

@media (max-width: 40rem) {
  .layout { padding: 0.75rem 0.5rem 2rem; }
  main, nav.toc { padding: 1rem; }
  dd, .rs { margin-left: 1ch; }
}

@media print {
  body { background: white; color: black; }
  .layout { display: block; padding: 0; max-width: none; }
  nav.toc, .skip, .manuals { display: none; }
