name: Bug report
description: Report incorrect shell behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Every field below is answered against the version you actually ran.
  - type: textarea
    id: version
    attributes:
      label: Version
      description: The complete output of `kosh --version`.
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        The smallest script or command sequence that shows the problem, with the
        files and the environment it needs.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: >
        What the shell was supposed to do. Name the reference shell and its
        version when the report is about compatibility.
    validations:
      required: true
  - type: textarea
    id: xtrace
    attributes:
      label: Execution trace and optionally a debug log
      description: >
        The output of the reproducer run with `set -x -N`, or with the `-x -N`
        options on the command line.

        For a debug log, you'll need a debug build to write an internal log.
        Build the shell yourself with `make MODE=dbg` and run `./kosh-dbg -X all
        --debug-logging-file=kosh-debug.log` on the reproducer, then attach the
        log.
      render: text
    validations:
      required: true