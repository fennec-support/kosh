name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit to build from'
        required: true
        default: master
        type: string
      tag:
        description: 'Tag name to create and attach the artifacts to'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve release commit and verify CI
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve the selected commit
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-image:
    name: Build or pull the cached image
    needs: resolve
    uses: ./.github/workflows/build-image.yml
    with:
      commit_sha: ${{ needs.resolve.outputs.sha }}
    permissions:
      contents: read
      packages: write

  build:
    name: Release / Cross-compile
    needs:
      - resolve
      - build-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      IMAGE: ${{ needs.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the cross toolchain image
        run: docker pull "$IMAGE"

      - name: Cross-compile the three release binaries
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e "VERSION=$VERSION" "$IMAGE" \
            sh -euc '
              mkdir -p dist
              make -C src MODE=rel TARGET=Linux ARCH=x86_64
              install -m 755 kosh "dist/kosh-linux-amd64-$VERSION"
              make -C src MODE=rel TARGET=Windows_NT ARCH=x86_64
              install -m 755 kosh.exe "dist/kosh-win32-amd64-$VERSION.exe"
              make -C src MODE=rel TARGET=Darwin ARCH=aarch64
              install -m 755 kosh "dist/kosh-darwin-aarch64-$VERSION"
            '

      - name: Upload the binaries as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}-cross
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  build-linux-arm64:
    name: Release / Build Linux arm64
    needs: resolve
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Build the native Linux arm64 binary
        run: |
          make CXX=g++ LINKER_SELECTION_FLAG= MODE=rel kosh
          mkdir -p dist
          install -m 755 kosh "dist/kosh-linux-aarch64-$VERSION"
          readelf -h "dist/kosh-linux-aarch64-$VERSION" |
            grep -Eq 'Machine:[[:space:]]+AArch64'

      - name: Upload the Linux arm64 binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.VERSION }}-linux-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Release / Attach binaries
    needs:
      - resolve
      - build
      - build-linux-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ github.event.inputs.tag || github.ref_name }}
      COMMIT_SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Check an existing release tag
        run: |
          if git ls-remote --exit-code --refs origin \
            "refs/tags/$VERSION" >/dev/null; then
            git fetch --force --no-tags origin \
              "refs/tags/$VERSION:refs/tags/$VERSION"
            release_sha=$(git rev-parse "refs/tags/$VERSION^{commit}")
            if [ "$release_sha" != "$COMMIT_SHA" ]; then
              echo "The release tag targets a different commit." >&2
              exit 1
            fi
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi

      - name: Download the release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-${{ env.VERSION }}-*
          merge-multiple: true

      - name: Add the manual pages, completion and install scripts
        run: |
          zstd -19 -q -o dist/kosh.1.zst docs/kosh.1
          zstd -19 -q -o dist/kosh.5.zst docs/kosh.5
          install -m 644 completions/kosh.bash dist/kosh.bash
          install -m 755 scripts/install.sh dist/install.sh
          install -m 644 scripts/install.ps1 dist/install.ps1

      - name: Write the checksum list
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Upload the consolidated workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kosh-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

      - name: Create the prerelease when it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" --title "$VERSION" --notes '<TBD>' \
            --prerelease ||
            gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force --no-tags origin \
            "refs/tags/$VERSION:refs/tags/$VERSION"
          release_sha=$(git rev-parse "refs/tags/$VERSION^{commit}")
          if [ "$release_sha" != "$COMMIT_SHA" ]; then
            echo "The release tag targets a different commit." >&2
            exit 1
          fi
          gh release upload "$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"
