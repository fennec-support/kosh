name: CI

on:
  push:
  pull_request:

jobs:
  build-test-bench:
    name: Build, test and bench
    runs-on: ubuntu-24.04
    container:
      image: alpine:latest
    steps:
      - name: Install the toolchain
        shell: sh
        run: |
          apk add --no-cache \
            nodejs git git-doc make build-base musl-dev linux-headers clang \
            llvm lld compiler-rt yash bash dash zsh busybox coreutils mandoc \
            util-linux-misc python3 expect perl pandoc
          [ -e /bin/dash ] || ln -s /usr/bin/dash /bin/dash
          git config --global --add safe.directory '*'
          llvm_bin=$(find /usr/lib /usr/bin -name llvm-profdata 2>/dev/null \
            | head -1 | xargs -r dirname)
          [ -n "$llvm_bin" ] && echo "$llvm_bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify the test toolchain
        run: sh scripts/verify-test-toolchain.sh

      - name: Create the test user
        run: |
          adduser -D -s /bin/sh tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
          chown tester:tester "$(dirname "$GITHUB_WORKSPACE")"

      - name: Build ASAN binary
        run: su tester -c 'make kosh'

      - name: Verify generated artifacts
        run: |
          make docs baked-scripts
          ./scripts/generate-completions.sh ./kosh-dbg completions/kosh.bash \
            > completions/kosh.bash.new
          mv completions/kosh.bash.new completions/kosh.bash
          git diff --exit-code \
            --ignore-matching-lines='^[.][\\]" Automatically generated by Pandoc [0-9.]+$' \
            -- man
          git diff --exit-code -- src/BakedScripts.hpp completions/kosh.bash

      - name: Run golden tests
        run: su tester -c 'make test'

      - name: Build release binary
        run: >-
          su tester -c 'make clean &&
          make CXX=g++ LINKER_SELECTION_FLAG= MODE=rel kosh && du -sh kosh'

      - name: Run benchmark
        run: >-
          su tester -c 'SCALE=200 BENCH_WARMUP_COUNT=2 BENCH_SAMPLE_COUNT=7
          DASH_SPEEDUP_REQUIRED=1 BASH_SPEEDUP_REQUIRED=3
          make MODE=rel bench'

      - name: Build release binary with code coverage
        if: '!cancelled()'
        run: su tester -c 'make clean && make MODE=cov kosh'

      - name: Run tests under release coverage binary
        if: '!cancelled()'
        run: su tester -c 'make MODE=cov test'

      - name: Record release binary coverage
        if: always()
        shell: bash
        run: |
          ./scripts/llvm-tool.sh llvm-profdata merge -sparse \
            -failure-mode=all coverage/profraw/*.profraw \
            -o coverage/kosh.profdata
          {
            echo '## Coverage'
            echo
            echo '| File | Line cover | Branch cover |'
            echo '| --- | --- | --- |'
            ./scripts/llvm-tool.sh llvm-cov report ./kosh-cov \
              -instr-profile=coverage/kosh.profdata src \
              -ignore-filename-regex='toiletline' \
              | awk 'NF>=13 && $1!="Filename" && $1!~/^-/ { print "| "$1" | "$10" | "$13" |" }'
            echo
            echo '<details><summary>Uncovered line ranges</summary>'
            echo
            echo '| File | Uncovered lines |'
            echo '| --- | --- |'
            ./scripts/llvm-tool.sh llvm-cov export ./kosh-cov \
              -instr-profile=coverage/kosh.profdata src \
              -ignore-filename-regex='toiletline' -format=lcov \
              | awk '
                  /^SF:/ { f=$0; sub(/^SF:/,"",f); sub(/.*\/src\//,"",f);
                           s=0; p=0; next }
                  /^DA:/ {
                    split(substr($0,4),a,","); l=a[1]+0; c=a[2]+0;
                    if (c==0) {
                      if (s==0) { s=l; p=l }
                      else if (l==p+1) { p=l }
                      else { r[f]=r[f] (r[f]?", ":"") (s==p?s:s"-"p); s=l; p=l }
                    }
                    next
                  }
                  /^end_of_record/ {
                    if (s!=0) r[f]=r[f] (r[f]?", ":"") (s==p?s:s"-"p);
                    s=0; p=0; next
                  }
                  END { for (f in r) print "| "f" | "r[f]" |" }
                ' | sort
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz the parsers
    # musl has no ASan, so this job runs on the glibc runner itself.
    runs-on: ubuntu-24.04
    steps:
      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev make

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build and run the harnesses
        run: make CXX=clang++-18 FUZZ_SECONDS=60 fuzz

      - name: Keep the crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/crashes

  debug-macos:
    name: Run debug build tests on macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install the test shells
        run: |
          brew install bash dash-shell coreutils
          echo "BASHP=$(brew --prefix bash)/bin/bash" >> "$GITHUB_ENV"
          echo "DASH=$(brew --prefix dash-shell)/bin/dash" >> "$GITHUB_ENV"

      - name: Verify the test toolchain
        run: sh scripts/verify-test-toolchain.sh

      - name: Build ASAN binary
        run: make kosh

      - name: Run golden tests
        run: make test

  debug-windows:
    name: Run debug build tests on Windows
    runs-on: windows-2025
    env:
      MSYS: winsymlinks:nativestrict
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: MSYS
          update: true
          install: make

      - name: Install the test toolchain
        shell: pwsh
        run: |
          $developerModePath = `
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          New-Item -Path $developerModePath -Force | Out-Null
          New-ItemProperty -Path $developerModePath `
            -Name AllowDevelopmentWithoutDevLicense -Value 1 `
            -PropertyType DWord -Force | Out-Null
          'C:\msys64\usr\bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install LLVM 22 for MSVC
        shell: pwsh
        run: |
          $version = '22.1.8'
          $installer = Join-Path $env:RUNNER_TEMP "LLVM-$version-win64.exe"
          $llvmDirectory = Join-Path $env:RUNNER_TEMP 'kosh-llvm'
          $release = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version"
          Invoke-WebRequest "$release/LLVM-$version-win64.exe" -OutFile $installer
          $expectedHash = '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash -ne $expectedHash) {
            throw 'Unexpected LLVM installer SHA-256'
          }
          $install = Start-Process -FilePath $installer `
            -ArgumentList '/S', "/D=$llvmDirectory" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "LLVM installation failed with exit code $($install.ExitCode)"
          }
          Join-Path $llvmDirectory 'bin' |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Remove-Item -LiteralPath $installer

      - name: Verify the test toolchain
        shell: pwsh
        run: |
          $makePath = 'C:/msys64/usr/bin/make.exe'
          $resolvedMakePath = (Get-Command make.exe -ErrorAction Stop).Source `
            -replace '\\', '/'
          if ($resolvedMakePath -ne $makePath) {
            throw "Unexpected make executable at $resolvedMakePath"
          }
          $makeVersion = make.exe --version | Select-Object -First 1
          if ($makeVersion -notlike 'GNU Make 4.*') {
            throw "Unexpected make version: $makeVersion"
          }
          $shPath = 'C:/msys64/usr/bin/sh.exe'
          $resolvedShPath = (Get-Command sh.exe -ErrorAction Stop).Source `
            -replace '\\', '/'
          if ($resolvedShPath -ne $shPath) {
            throw "Unexpected sh executable at $resolvedShPath"
          }
          $shellPlatform = sh.exe -c 'uname -s'
          if ($shellPlatform -notlike 'MSYS_NT-*') {
            throw "Unexpected shell platform: $shellPlatform"
          }
          sh.exe -c `
            'for tool in env mkfifo mktemp rm script sed stat strings stty tee; do command -v "$tool" || exit 1; done'
          if ($LASTEXITCODE -ne 0) {
            throw "The MSYS2 golden test toolchain is incomplete"
          }
          $symlinkProbeDirectory = Join-Path ([IO.Path]::GetTempPath()) `
            "kosh-symlink-$([guid]::NewGuid())"
          $symlinkProbePath = $symlinkProbeDirectory -replace '\\', '/'
          $symlinkProbeCommand = `
            'mkdir -p "$1/target" && ' +
            'ln -s target "$1/directory-link" && ' +
            ': > "$1/missing" && ln -s missing "$1/dangling-link" && ' +
            'mv "$1/missing" "$1/moved"'
          sh.exe -c $symlinkProbeCommand sh $symlinkProbePath
          if ($LASTEXITCODE -ne 0) {
            throw "MSYS2 could not create native test symlinks"
          }
          foreach ($linkName in 'directory-link', 'dangling-link') {
            $link = Get-Item -LiteralPath `
              (Join-Path $symlinkProbeDirectory $linkName) -Force
            if ($link.LinkType -ne 'SymbolicLink') {
              throw "$linkName is not a native symbolic link"
            }
          }
          Remove-Item -LiteralPath $symlinkProbeDirectory -Recurse -Force
          $clangPath = (Get-Command clang++.exe -ErrorAction Stop).Source
          $expectedClangPath = Join-Path $env:RUNNER_TEMP 'kosh-llvm\bin\clang++.exe'
          if ($clangPath -ne $expectedClangPath) {
            throw "Unexpected clang++ executable at $clangPath"
          }
          $clangTarget = clang++ -dumpmachine
          if ($LASTEXITCODE -ne 0 -or $clangTarget -notlike 'x86_64-*-windows-msvc*') {
            throw "Unexpected clang++ target: $clangTarget"
          }
          '#include <initializer_list>' | clang++ -std=c++23 -fsyntax-only -x c++ -
          if ($LASTEXITCODE -ne 0) {
            throw 'Clang and the installed MSVC C++ headers are incompatible'
          }
          Get-Command python3.exe -ErrorAction Stop
          clang++ --version | Select-Object -First 1
          sh --version | Select-Object -First 1
          python3 --version

      - name: Build ASAN binary
        run: make.exe kosh

      - name: Run golden tests
        shell: pwsh
        run: make.exe test
